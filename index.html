<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mappa Statistica - Dashboard</title>

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />

  <!-- Stile personalizzato -->
  <link rel="stylesheet" href="style.css" />

  <!-- PapaParse per leggere CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <!-- Turf.js per operazioni GIS (clipping/intersection) -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
</head>
<body>

  <!-- Tutorial -->
  <script src="tutorial.js"></script>
  <script>
    window.addEventListener('load', () => {
      new Tutorial();
    });
  </script>  

  <!-- Sidebar -->
  <div id="sidebar">
    <h2>Dashboard Dati Territoriali</h2>
    
    <div id="grouping-control">
      <label class="switch">
        <input type="checkbox" id="group-by-municipality">
        <span class="slider round"></span>
      </label>
      <span class="switch-label">Principali comuni italiani</span>
    </div>

    <!-- Selettori città (STAT_DATA) -->
    <div id="city-toggles" class="city-toggle-section">
      <h3>Dati per città</h3>

      <div class="city-switches">
        <label class="switch switch-blue">
          <input type="checkbox" id="toggle-napoli" checked>
          <span class="slider blue round"></span>
        </label>
        <span class="city-label">Napoli</span>
      </div>

      <div class="city-switches">
        <label class="switch switch-blue">
          <input type="checkbox" id="toggle-trento">
          <span class="slider blue round"></span>
        </label>
        <span class="city-label">Trento</span>
      </div>

      <div class="city-switches">
        <label class="switch switch-blue">
          <input type="checkbox" id="toggle-genova">
          <span class="slider blue round"></span>
        </label>
        <span class="city-label">Genova</span>
      </div>

      <small class="city-note">Gli switcher riguardano solo i Dati Statistici. La sezione Demografica resta su Napoli.</small>
    </div>

    <!-- Rischi ambientali (clippati su ASC attivi) -->
    <div id="hazard-toggles" class="hazard-toggle-section">
      <h3>Rischi ambientali</h3>

      <div class="hazard-switches">
        <label class="switch switch-green">
          <input type="checkbox" id="toggle-idro">
          <span class="slider green round"></span>
        </label>
        <span class="hazard-label">Rischio idrogeologico (ISPRA)</span>
      </div>

      <div class="hazard-switches">
        <label class="switch switch-green">
          <input type="checkbox" id="toggle-vulcani">
          <span class="slider green round"></span>
        </label>
        <span class="hazard-label">Pericolo vulcanico</span>
      </div>
    </div>

    <h2>Seleziona ambito</h2>

    <!-- Contenitore delle macro-sezioni -->
    <div id="ambito-buttons">
      <!-- Le sezioni verranno generate dinamicamente da JavaScript -->
    </div>

    <div id="legend">
      <h3>Legenda</h3>
      <div id="gradient-bar"></div>
      <div id="range-values">
        <span id="min-val">0</span>
        <span id="max-val">100</span>
      </div>
    </div>
  </div>
    
  <!-- Mappa -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.1/dist/chart.min.js"></script>
  
  <script src="./elaborazione_stat_data/charts.js"></script>
  <script src="./elaborazione_demografica/charts_demografica.js"></script>
  <script type="module" src="./elaborazione_demografica/detail_demografica_chart.js"></script>
  
  <script type="module" src="dashboard.js"></script>
  <script type="module" src="map.js"></script> 
</body>
</html>
