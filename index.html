      <div class="city-switches">

</div>
</div>
    
  <!-- Mappa -->

  <!-- Grafici esistenti -->
  <script src="./elaborazione_stat_data/charts.js"></script>
  <script src="./elaborazione_demografica/charts_demografica.js"></script>
  <script type="module" src="./elaborazione_demografica/detail_demografica_chart.js"></script>
  <script src="./demografica_generale/charts_demografica_generale.js"></script>
    <script src="./elaborazione_turismo/charts_turismo.js"></script>

  <!-- App principale -->
  <script type="module" src="dashboard.js"></script>
  <script type="module" src="map.js"></script>

  <!-- Timeline (dopo map.js così trova window.mapManager al primo refresh) -->
  <script src="./timeline/timeline_charts.js"></script>
  <script src="./timeline/timeline.js"></script>
  
  
  <script>
  // Sostituisce il titolo "Dashboard Dati Territoriali" con un bottone "Further details"
  (function(){
    function replaceByText(root, regex){
      const candidates = root.querySelectorAll('h1,h2,h3,.sidebar-title,.panel-title,.title');
      for (const el of candidates){
        if (regex.test(el.textContent || '')){
          const btn = document.createElement('a');
          btn.href = './info/index.html';
          btn.className = 'sidebar-info-btn';
          btn.textContent = 'Further details';
          el.replaceWith(btn);
          return true;
        }
      }
      return false;
    }
    if (document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', () => replaceByText(document, /dashboard\s+dati\s+territoriali/i));
    } else {
      replaceByText(document, /dashboard\s+dati\s+territoriali/i);
    }
  })();
</script>

<script>
  // Applica ?ds=<dataset> sulla mappa (attiva il pannello giusto)
  (function(){
    const params = new URLSearchParams(location.search);
    const ds = params.get('ds');
    const allowed = new Set(['stat_data','demografica','dem_gen','turismo']);
    if (!ds || !allowed.has(ds)) return;

    function apply(){
      const dash = window.dashboard;
      if (!dash) return;
      dash.activeDataset = ds;
      dash.renderDatasetButtons();
      dash.renderDatasetPanel();
      // scorro alla sezione dataset
      document.getElementById('dataset-grid')?.scrollIntoView({ behavior:'smooth', block:'start' });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', apply);
    } else { apply(); }
  })();
</script>

<div id="tutorial-fab" class="tutorial-fab" aria-label="Apri tutorial" title="Apri tutorial">i</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('tutorial-fab')?.addEventListener('click', () => {
      if (window.openCureTutorial) window.openCureTutorial();
      else new Tutorial({ forceOpen: true }); // fallback se l'helper non è caricato
    });
  });
</script>

</body>
